server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location ^~ /rdkit-api/ {
        proxy_pass http://dev-myworkspace-rdkit-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /compound-search-api/ {
        proxy_pass http://dev-myworkspace-compound-search-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://dev-myworkspace-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /pdfjs/ {
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        default_type application/pdf;
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # Ensure ES module workers are served with JavaScript MIME type.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        try_files $uri =404;
    }

    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # error_page  404              /404.html;

    # redirect server error pages to the static page /500.x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
