name: Dev Server Deploy

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: [self-hosted, myworkspace]
    environment: dev_myworkspace

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RDKIT_SUBMODULE_TOKEN }}
          submodules: recursive

      - name: Prepare runtime data files
        run: |
          set -euo pipefail
          gmail_token_source="/home/thmoon/devops/myworkspace/secrets/gmail/token.json"
          groupware_members_source="/home/thmoon/devops/myworkspace/secrets/gmail/getMembers.json"

          if [ ! -f "${gmail_token_source}" ]; then
            echo "::error::Gmail OAuth token file is missing on the dev server."
            exit 1
          fi

          if [ ! -f "${groupware_members_source}" ]; then
            echo "::error::Groupware members file is missing on the dev server."
            exit 1
          fi

          install -d -m 700 secrets/gmail
          install -m 600 "${gmail_token_source}" secrets/gmail/token.json
          install -d -m 700 sample/groupware_mail_system
          install -m 600 \
            "${groupware_members_source}" \
            sample/groupware_mail_system/getMembers.json

      - name: Build and Run Docker Containers
        env:
          COMPOUND_API_AUTH_TOKEN: ${{ secrets.COMPOUND_API_AUTH_TOKEN }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRETS: ${{ secrets.BETTER_AUTH_SECRETS }}
          AUTH_BOOTSTRAP_ADMIN_EMAILS: ${{ vars.AUTH_BOOTSTRAP_ADMIN_EMAILS }}
          TLS_CERT_PATH: ${{ vars.TLS_CERT_PATH }}
          TLS_KEY_PATH: ${{ vars.TLS_KEY_PATH }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          # self-hosted runner는 checkout한 디렉토리에서 직접 실행됩니다.
          docker compose -f docker-compose.dev.yml up --build -d --force-recreate
          
          # 사용하지 않는 이미지 정리
          docker image prune -f
