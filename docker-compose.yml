services:
  local-myworkspace-frontend:
    container_name: local-myworkspace-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - VITE_RDKIT_API_URL=/rdkit-api
      - VITE_COMPOUND_SEARCH_API_URL=/compound-search-api
      - VITE_MONITORING_URL=/monitoring/
    depends_on:
      - local-myworkspace-backend
      - local-myworkspace-rdkit-api
      - local-myworkspace-compound-search-api
    networks:
      - myworkspace-net

  local-myworkspace-backend:
    container_name: local-myworkspace-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CORS_ORIGINS=http://localhost:5174,http://localhost:18080
      - PATENT_ANALYSIS_HELPER_API_URL=http://172.16.1.210:10130
      - PATENT_ANALYSIS_UPLOAD_API_URL=http://172.16.1.210:8000
      - PATENT_INSIGHT_API_URL=http://172.16.1.210:8000
      - PATENT_ANALYSIS_OWNER_ID=171
      - CONFORMER_API_URL=http://172.16.1.203:8000
      - CONFORMER_API_TIMEOUT_MS=120000
      - COMPOUND_API_URL=http://172.16.1.32:10050
      - COMPOUND_API_AUTH_TOKEN=${COMPOUND_API_AUTH_TOKEN:-}
      - COMPOUND_API_TIMEOUT_MS=30000
      - HTTP_TIMEOUT_MS=30000
    networks:
      - myworkspace-net

  local-myworkspace-rdkit-api:
    container_name: local-myworkspace-rdkit-api
    build:
      context: .
      dockerfile: docker/rdkit-api.Dockerfile
    ports:
      - "8010:8000"
    volumes:
      - ./rdkit:/app
    networks:
      - myworkspace-net

  local-myworkspace-compound-search-api:
    container_name: local-myworkspace-compound-search-api
    build:
      context: .
      dockerfile: docker/compound-search-api.Dockerfile
    ports:
      - "8020:8080"
    volumes:
      - ./compound_search:/app
    networks:
      - myworkspace-net

networks:
  myworkspace-net:
    driver: bridge
