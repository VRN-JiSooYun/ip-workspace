services:
  dev-ipworkspace-postgres:
    container_name: dev-ipworkspace-postgres
    image: postgres:17
      #image: harbor.dev.voronoi/math2/ip-workspace/db:1.0.0
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ip_ws}
      - POSTGRES_USER=${POSTGRES_USER:-ip_ws}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - TZ=UTC
    volumes:
      - dev-ipworkspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev-ipworkspace-net

  dev-ipworkspace-migrate:
    container_name: dev-ipworkspace-migrate
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: build
    restart: "no"
    command: ["bun", "run", "prisma:migrate:deploy"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ip_ws}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@dev-ipworkspace-postgres:5432/${POSTGRES_DB:-ip_ws}?schema=public
    depends_on:
      dev-ipworkspace-postgres:
        condition: service_healthy
    networks:
      - dev-ipworkspace-net

  dev-ipworkspace-frontend:
    container_name: dev-ipworkspace-frontend
    image: harbor.dev.voronoi/math2/ip-workspace/web:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        # 앞단 nginx가 `location /ip-workspace/`로 라우팅하므로 앱은 이 prefix 아래에서 서빙된다.
        BASE_PATH: ${BASE_PATH:-/ip-workspace/}
    restart: always
    ports:
      - "25443:80"
    environment:
      # 브라우저가 보내는 경로이므로 prefix를 포함해야 하고, 앞단 nginx가 이를 벗겨 컨테이너로 넘긴다.
      - VITE_API_URL=${BASE_PATH:-/ip-workspace/}api
      - VITE_RDKIT_API_URL=${BASE_PATH:-/ip-workspace/}rdkit-api
      - VITE_COMPOUND_SEARCH_API_URL=${BASE_PATH:-/ip-workspace/}compound-search-api
      - VITE_CHEMDRAW_CLIPBOARD_FIXER_URL=http://localhost:47823
      - VITE_GROUPWARE_ORIGIN=${VITE_GROUPWARE_ORIGIN:-https://voronoi.app}
      - VITE_GMAIL_ALLOWED_RECIPIENT_DOMAINS=${GMAIL_ALLOWED_RECIPIENT_DOMAINS:-voronoi.io}
      - MONITORING_PROXY_TARGET=http://172.16.1.200:2026
    depends_on:
      - dev-ipworkspace-backend
        #- dev-ipworkspace-rdkit-api
        #- dev-ipworkspace-compound-search-api
    networks:
      - dev-ipworkspace-net

  dev-ipworkspace-backend:
    container_name: dev-ipworkspace-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "25444:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGINS=${PUBLIC_ORIGIN:-https://voronoi.app:28000},http://localhost:25443,http://172.16.1.183:25443
      - PATENT_ANALYSIS_HELPER_API_URL=http://172.16.1.210:10130
      - PATENT_ANALYSIS_UPLOAD_API_URL=http://172.16.1.210:8000
      - PATENT_INSIGHT_API_URL=http://172.16.1.210:8000
      - PATENT_ANALYSIS_OWNER_ID=171
      - CONFORMER_API_URL=http://172.16.1.203:8000
      - CONFORMER_API_TIMEOUT_MS=120000
      - COMPOUND_API_URL=http://172.16.1.32:10050
      - COMPOUND_API_AUTH_TOKEN=${COMPOUND_API_AUTH_TOKEN:-}
      - COMPOUND_API_TIMEOUT_MS=30000
      - HTTP_TIMEOUT_MS=30000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ip_ws}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@dev-ipworkspace-postgres:5432/${POSTGRES_DB:-ip_ws}?schema=public
      - BETTER_AUTH_URL=${PUBLIC_ORIGIN:-https://voronoi.app:28000}
      - BETTER_AUTH_TRUSTED_ORIGINS=${PUBLIC_ORIGIN:-https://voronoi.app:28000},http://localhost:25443,http://172.16.1.183:25443
      - BETTER_AUTH_SECRETS=${BETTER_AUTH_SECRETS:?BETTER_AUTH_SECRETS is required}
      - GROUPWARE_ORIGIN=${GROUPWARE_ORIGIN:-https://voronoi.app}
      - GROUPWARE_LOGIN_CHECK_URL=${GROUPWARE_LOGIN_CHECK_URL:-http://172.16.1.32:10050/login_check}
      - GROUPWARE_LOGIN_CHECK_TIMEOUT_MS=10000
      - GROUPWARE_REVALIDATE_INTERVAL_SECONDS=${GROUPWARE_REVALIDATE_INTERVAL_SECONDS:-600}
      - AUTH_SESSION_EXPIRES_IN_SECONDS=21600
      - AUTH_SESSION_UPDATE_AGE_SECONDS=1800
      - AUTH_BOOTSTRAP_ADMIN_EMAILS=${AUTH_BOOTSTRAP_ADMIN_EMAILS:-}
      - NOTIFICATION_RECIPIENT_IMPORT_ROOT=/app/imports/notification-recipients
      - GMAIL_OAUTH_TOKEN_FILE=/run/secrets/gmail/token.json
      - GMAIL_FROM_EMAIL=${GMAIL_FROM_EMAIL:-vgw@voronoi.io}
      - GMAIL_ALLOWED_RECIPIENT_DOMAINS=${GMAIL_ALLOWED_RECIPIENT_DOMAINS:-voronoi.io}
      - PUBLIC_APP_BASE_URL=${PUBLIC_ORIGIN:-https://voronoi.app:28000}
      - GMAIL_OUTBOX_POLL_INTERVAL_MS=5000
      - GMAIL_OUTBOX_LEASE_DURATION_MS=60000
      - GMAIL_OUTBOX_MAX_ATTEMPTS=5
    volumes:
      - dev-ipworkspace-notification-recipient-import-data:/app/imports/notification-recipients
      - ./secrets/gmail/token.json:/run/secrets/gmail/token.json:ro
    depends_on:
      dev-ipworkspace-postgres:
        condition: service_healthy
      dev-ipworkspace-migrate:
        condition: service_completed_successfully
    networks:
      - dev-ipworkspace-net

networks:
  dev-ipworkspace-net:
    driver: bridge

volumes:
  dev-ipworkspace-postgres-data:
  dev-ipworkspace-notification-recipient-import-data:
