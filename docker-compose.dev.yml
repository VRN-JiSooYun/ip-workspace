services:
  dev-myworkspace-frontend:
    container_name: dev-myworkspace-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "18080:80"
    environment:
      - VITE_API_URL=/api
      - VITE_RDKIT_API_URL=/rdkit-api
    depends_on:
      - dev-myworkspace-backend
      - dev-myworkspace-rdkit-api
    networks:
      - dev-myworkspace-net

  dev-myworkspace-backend:
    container_name: dev-myworkspace-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "18082:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGINS=http://localhost:18080,http://172.16.1.183:18080
      - PATENT_ANALYSIS_HELPER_API_URL=http://172.16.1.210:10130
      - PATENT_ANALYSIS_UPLOAD_API_URL=http://172.16.1.210:8000
      - PATENT_ANALYSIS_OWNER_ID=171
      - HTTP_TIMEOUT_MS=30000
    networks:
      - dev-myworkspace-net

  dev-myworkspace-rdkit-api:
    container_name: dev-myworkspace-rdkit-api
    build:
      context: .
      dockerfile: docker/rdkit-api.Dockerfile
    restart: always
    ports:
      - "18081:8000"
    volumes:
      - ./rdkit:/app
    networks:
      - dev-myworkspace-net

networks:
  dev-myworkspace-net:
    driver: bridge
