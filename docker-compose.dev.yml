services:
  dev-myworkspace-postgres:
    container_name: dev-myworkspace-postgres
    image: postgres:14.23-alpine3.24
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-medichem}
      - POSTGRES_USER=${POSTGRES_USER:-medichem}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - TZ=UTC
    volumes:
      - dev-myworkspace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev-myworkspace-net

  dev-myworkspace-migrate:
    container_name: dev-myworkspace-migrate
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: build
    restart: "no"
    command: ["bun", "run", "prisma:migrate:deploy"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medichem}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@dev-myworkspace-postgres:5432/${POSTGRES_DB:-medichem}?schema=public
    depends_on:
      dev-myworkspace-postgres:
        condition: service_healthy
    networks:
      - dev-myworkspace-net

  dev-myworkspace-frontend:
    container_name: dev-myworkspace-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "18080:443"
    volumes:
      - "${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/certs/fullchain.pem:ro"
      - "${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/certs/private.key:ro"
    environment:
      - VITE_API_URL=/api
      - VITE_RDKIT_API_URL=/rdkit-api
      - VITE_COMPOUND_SEARCH_API_URL=/compound-search-api
      - VITE_CHEMDRAW_CLIPBOARD_FIXER_URL=http://localhost:47823
      - VITE_GROUPWARE_ORIGIN=${VITE_GROUPWARE_ORIGIN:-https://voronoi.app}
      - VITE_GMAIL_ALLOWED_RECIPIENT_DOMAINS=${GMAIL_ALLOWED_RECIPIENT_DOMAINS:-voronoi.io}
      - MONITORING_PROXY_TARGET=http://172.16.1.200:2026
    depends_on:
      - dev-myworkspace-backend
      - dev-myworkspace-rdkit-api
      - dev-myworkspace-compound-search-api
    networks:
      - dev-myworkspace-net

  dev-myworkspace-backend:
    container_name: dev-myworkspace-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "18082:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGINS=${PUBLIC_ORIGIN:-https://voronoi.app:28000},https://localhost:18080,https://172.16.1.183:18080
      - PATENT_ANALYSIS_HELPER_API_URL=http://172.16.1.210:10130
      - PATENT_ANALYSIS_UPLOAD_API_URL=http://172.16.1.210:8000
      - PATENT_INSIGHT_API_URL=http://172.16.1.210:8000
      - PATENT_ANALYSIS_OWNER_ID=171
      - CONFORMER_API_URL=http://172.16.1.203:8000
      - CONFORMER_API_TIMEOUT_MS=120000
      - COMPOUND_API_URL=http://172.16.1.32:10050
      - COMPOUND_API_AUTH_TOKEN=${COMPOUND_API_AUTH_TOKEN:-}
      - COMPOUND_API_TIMEOUT_MS=30000
      - HTTP_TIMEOUT_MS=30000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medichem}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@dev-myworkspace-postgres:5432/${POSTGRES_DB:-medichem}?schema=public
      - BETTER_AUTH_URL=${PUBLIC_ORIGIN:-https://voronoi.app:28000}
      - BETTER_AUTH_TRUSTED_ORIGINS=${PUBLIC_ORIGIN:-https://voronoi.app:28000},https://localhost:18080,https://172.16.1.183:18080
      - BETTER_AUTH_SECRETS=${BETTER_AUTH_SECRETS:?BETTER_AUTH_SECRETS is required}
      - GROUPWARE_ORIGIN=${GROUPWARE_ORIGIN:-https://voronoi.app}
      - GROUPWARE_LOGIN_CHECK_URL=${GROUPWARE_LOGIN_CHECK_URL:-http://172.16.1.32:10050/login_check}
      - GROUPWARE_LOGIN_CHECK_TIMEOUT_MS=10000
      - GROUPWARE_REVALIDATE_INTERVAL_SECONDS=${GROUPWARE_REVALIDATE_INTERVAL_SECONDS:-600}
      - AUTH_SESSION_EXPIRES_IN_SECONDS=21600
      - AUTH_SESSION_UPDATE_AGE_SECONDS=1800
      - AUTH_BOOTSTRAP_ADMIN_EMAILS=${AUTH_BOOTSTRAP_ADMIN_EMAILS:-}
      - NOTIFICATION_RECIPIENT_IMPORT_ROOT=/app/imports/notification-recipients
      - GMAIL_OAUTH_TOKEN_FILE=/run/secrets/gmail/token.json
      - GMAIL_FROM_EMAIL=${GMAIL_FROM_EMAIL:-vgw@voronoi.io}
      - GMAIL_ALLOWED_RECIPIENT_DOMAINS=${GMAIL_ALLOWED_RECIPIENT_DOMAINS:-voronoi.io}
      - PUBLIC_APP_BASE_URL=${PUBLIC_ORIGIN:-https://voronoi.app:28000}
      - GMAIL_OUTBOX_POLL_INTERVAL_MS=5000
      - GMAIL_OUTBOX_LEASE_DURATION_MS=60000
      - GMAIL_OUTBOX_MAX_ATTEMPTS=5
    volumes:
      - dev-myworkspace-notification-recipient-import-data:/app/imports/notification-recipients
      - ./secrets/gmail/token.json:/run/secrets/gmail/token.json:ro
    depends_on:
      dev-myworkspace-postgres:
        condition: service_healthy
      dev-myworkspace-migrate:
        condition: service_completed_successfully
    networks:
      - dev-myworkspace-net

  dev-myworkspace-rdkit-api:
    container_name: dev-myworkspace-rdkit-api
    build:
      context: .
      dockerfile: docker/rdkit-api.Dockerfile
    restart: always
    ports:
      - "18081:8000"
    volumes:
      - ./rdkit:/app
    networks:
      - dev-myworkspace-net

  dev-myworkspace-compound-search-api:
    container_name: dev-myworkspace-compound-search-api
    build:
      context: .
      dockerfile: docker/compound-search-api.Dockerfile
    restart: always
    ports:
      - "18083:8080"
    volumes:
      - ./compound_search:/app
    networks:
      - dev-myworkspace-net

networks:
  dev-myworkspace-net:
    driver: bridge

volumes:
  dev-myworkspace-postgres-data:
  dev-myworkspace-notification-recipient-import-data:
